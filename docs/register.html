<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartResolve - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="box">
    <h1>Create account</h1>
    <form id="registerForm">
      <label>Name <input type="text" id="name" required></label>
      <label>Email <input type="email" id="email" required></label>
      <label>Password (min 6 characters) <input type="password" id="password" required></label>
      <button type="submit">Register</button>
    </form>
    <div class="error" id="error"></div>
    <p>Already registered? <a href="login.html">Log in</a></p>
  </div>

  <script src="js/common.js"></script>
  <script src="js/mock-api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await api("/api/auth/register", {
        method: "POST",
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });

      if (result.ok) {
        window.location.href = "login.html";
      } else {
        document.getElementById("error").textContent = result.data.error || "Registration failed";
      }
    });
  </script>
</body>
</html>
